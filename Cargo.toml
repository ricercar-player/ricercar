[workspace]
resolver = "3"
members = ["crates/*"]

[workspace.package]
version = "0.7.0"
edition = "2024"
license = "MIT"
repository = "https://github.com/ricercar-player/ricercar"
rust-version = "1.92"

[workspace.dependencies]
ricercar-audio = { path = "crates/ricercar-audio", version = "0.7.0" }
ricercar-core = { path = "crates/ricercar-core", version = "0.7.0" }
ricercar-upnp = { path = "crates/ricercar-upnp", version = "0.7.0" }
ricercar-mpris = { path = "crates/ricercar-mpris", version = "0.7.0" }
ricercar-online = { path = "crates/ricercar-online", version = "0.7.0" }
ricercar-daemon = { path = "crates/ricercar-daemon", version = "0.7.0" }

thiserror = "2"
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter"] }
crossbeam-channel = "0.5"

[profile.release]
strip = true
lto = "thin"

# Third-party crates (decoders, image scaling, UI renderer) are unusably slow
# unoptimized; keep our own crates at opt-level 0 for fast rebuilds.
[profile.dev.package."*"]
opt-level = 2
