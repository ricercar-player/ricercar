[package]
name = "ricercar-core"
version = "0.7.0"
edition = "2024"
license.workspace = true
rust-version.workspace = true

[dependencies]
crossbeam-channel.workspace = true
image = { version = "0.25.10", default-features = false, features = ["jpeg", "png", "webp", "gif", "bmp"] }
libc = "0.2"
lofty = "0.25.4"
notify = "8.2.0"
rayon = "1.12.0"
ring = "0.17"
ricercar-audio.workspace = true
rusqlite = { version = "0.40.2", features = ["bundled"] }
serde = { version = "1.0.229", features = ["derive"] }
serde_json = "1.0.151"
thiserror.workspace = true
toml = "1.1.6"
tracing.workspace = true
ureq = "2.12"
walkdir = "2.5.0"
minisign-verify = "0.3"

# Reference plugin used by the plugin tests and the screenshot tour.
[[bin]]
name = "ricercar-demo-plugin"
path = "tests/fixtures/demo-plugin/main.rs"
test = false
doc = false

[dev-dependencies]
tempfile = "3.27.0"
