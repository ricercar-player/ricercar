[package]
name = "ricercar-online"
version = "0.3.0"
edition = "2024"
license.workspace = true
description = "Online integrations for ricercar: scrobbling, lyrics, internet radio, cover art (open APIs only)"

[dependencies]
md-5 = "0.11"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
thiserror.workspace = true
tracing.workspace = true
ureq = "2.12"

[dev-dependencies]
tempfile = "3"
