[package]
name = "ricercar-ui"
version = "0.7.0"
edition = "2024"
license.workspace = true
rust-version.workspace = true
description = "Bit-perfect music player and UPnP/OpenHome network receiver for Linux"
homepage = "https://github.com/ricercar-player/ricercar"
repository = "https://github.com/ricercar-player/ricercar"
readme = "../../README.md"

[dependencies]
chrono = { version = "0.4.45", default-features = false, features = ["clock"] }
ctrlc = { version = "3.5.2", features = ["termination"] }
ksni = { version = "0.3.6", default-features = false, features = ["blocking", "async-io"] }
qrcode = { version = "0.14", default-features = false }
image = { version = "0.25.10", default-features = false, features = ["jpeg", "png", "webp", "gif", "bmp"] }
rfd = { version = "0.17.2", default-features = false, features = ["xdg-portal", "pollster"] }
ricercar-audio = { version = "0.7.0", path = "../ricercar-audio" }
ricercar-core.workspace = true
ricercar-daemon = { version = "0.7.0", path = "../ricercar-daemon" }
ricercar-online = { version = "0.7.0", path = "../ricercar-online" }
serde = { version = "1.0.229", features = ["derive"] }
serde_json = "1.0.151"
slint = { version = "1.18.1", features = ["unstable-winit-030"] }
tracing.workspace = true
tracing-subscriber.workspace = true
ureq = "2.12"
zbus = "5.19.0"

[dev-dependencies]
tempfile = "3.27.0"

[build-dependencies]
slint-build = "1.18.1"

[[bin]]
name = "ricercar"
path = "src/main.rs"

# ---------------------------------------------------------------- packaging
# `cargo deb -p ricercar-ui` / `cargo generate-rpm -p crates/ricercar-ui`
# after `cargo build --release -p ricercar-ui -p ricercar-cli -p ricercar-daemon`
# and `dist/third-party-licenses.sh` (writes target/THIRD-PARTY-LICENSES).
# dist/self-update marks these as the project's own packages, which the app
# may upgrade in place; distribution packages must leave it out.

[package.metadata.deb]
name = "ricercar"
maintainer = "ricercar contributors <https://github.com/ricercar-player/ricercar>"
copyright = "ricercar contributors"
license-file = ["../../LICENSE", "0"]
extended-description = """\
A native, bit-perfect music player for Linux that is also a UPnP AV and \
OpenHome network receiver: local library with synced lyrics, playlists and \
internet radio, exclusive ALSA output at each track's native rate, and \
streaming pushed from phone apps such as BubbleUPnP or Kazoo."""
section = "sound"
priority = "optional"
# libxkbcommon is loaded at run time, so $auto does not see it.
depends = "$auto, libxkbcommon0"
recommends = "xdg-desktop-portal, polkitd | policykit-1"
assets = [
    ["target/release/ricercar", "usr/bin/", "755"],
    ["target/release/ricercar-cli", "usr/bin/", "755"],
    ["target/release/ricercar-daemon", "usr/bin/", "755"],
    ["../../dist/ricercar.desktop", "usr/share/applications/", "644"],
    ["../../dist/ricercar.svg", "usr/share/icons/hicolor/scalable/apps/", "644"],
    ["../../dist/icons/48x48/ricercar.png", "usr/share/icons/hicolor/48x48/apps/", "644"],
    ["../../dist/icons/128x128/ricercar.png", "usr/share/icons/hicolor/128x128/apps/", "644"],
    ["../../dist/icons/256x256/ricercar.png", "usr/share/icons/hicolor/256x256/apps/", "644"],
    ["../../dist/io.github.ricercar_player.ricercar.metainfo.xml", "usr/share/metainfo/", "644"],
    ["../../dist/ricercar.service", "usr/lib/systemd/user/", "644"],
    ["../../dist/self-update", "usr/share/ricercar/self-update", "644"],
    ["../../README.md", "usr/share/doc/ricercar/README.md", "644"],
    ["../../LICENSE", "usr/share/licenses/ricercar/LICENSE", "644"],
    ["../../target/THIRD-PARTY-LICENSES", "usr/share/licenses/ricercar/THIRD-PARTY-LICENSES", "644"],
    ["assets/fonts/OFL.txt", "usr/share/licenses/ricercar/OFL.txt", "644"],
    ["assets/icons/LICENSE", "usr/share/licenses/ricercar/icons-LICENSE", "644"],
]

[package.metadata.generate-rpm]
name = "ricercar"
summary = "Bit-perfect music player and UPnP/OpenHome network receiver"
license = "MIT"
assets = [
    { source = "target/release/ricercar", dest = "/usr/bin/ricercar", mode = "755" },
    { source = "target/release/ricercar-cli", dest = "/usr/bin/ricercar-cli", mode = "755" },
    { source = "target/release/ricercar-daemon", dest = "/usr/bin/ricercar-daemon", mode = "755" },
    { source = "../../dist/ricercar.desktop", dest = "/usr/share/applications/ricercar.desktop", mode = "644" },
    { source = "../../dist/ricercar.svg", dest = "/usr/share/icons/hicolor/scalable/apps/ricercar.svg", mode = "644" },
    { source = "../../dist/icons/48x48/ricercar.png", dest = "/usr/share/icons/hicolor/48x48/apps/ricercar.png", mode = "644" },
    { source = "../../dist/icons/128x128/ricercar.png", dest = "/usr/share/icons/hicolor/128x128/apps/ricercar.png", mode = "644" },
    { source = "../../dist/icons/256x256/ricercar.png", dest = "/usr/share/icons/hicolor/256x256/apps/ricercar.png", mode = "644" },
    { source = "../../dist/io.github.ricercar_player.ricercar.metainfo.xml", dest = "/usr/share/metainfo/io.github.ricercar_player.ricercar.metainfo.xml", mode = "644" },
    { source = "../../dist/ricercar.service", dest = "/usr/lib/systemd/user/ricercar.service", mode = "644" },
    { source = "../../dist/self-update", dest = "/usr/share/ricercar/self-update", mode = "644" },
    { source = "../../LICENSE", dest = "/usr/share/licenses/ricercar/LICENSE", mode = "644", doc = true },
    { source = "../../target/THIRD-PARTY-LICENSES", dest = "/usr/share/licenses/ricercar/THIRD-PARTY-LICENSES", mode = "644", doc = true },
    { source = "assets/fonts/OFL.txt", dest = "/usr/share/licenses/ricercar/OFL.txt", mode = "644", doc = true },
    { source = "assets/icons/LICENSE", dest = "/usr/share/licenses/ricercar/icons-LICENSE", mode = "644", doc = true },
    { source = "../../README.md", dest = "/usr/share/doc/ricercar/README.md", mode = "644", doc = true },
]

# Shared-library names rather than package names, so that one package works
# on Fedora, openSUSE and RHEL alike. Libraries the binaries link are also
# found automatically; libxkbcommon is loaded at run time and must be listed.
[package.metadata.generate-rpm.requires]
"libasound.so.2()(64bit)" = "*"
"libfontconfig.so.1()(64bit)" = "*"
"libxkbcommon.so.0()(64bit)" = "*"

[package.metadata.generate-rpm.recommends]
xdg-desktop-portal = "*"
polkit = "*"
